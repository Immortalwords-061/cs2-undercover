<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CS2 游戏大厅</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cs2-undercover.onrender.com/socket.io/socket.io.js"></script>
</head>

<body>

<div class="container">

    <h1>🎮 CS2 游戏大厅</h1>


    <!-- =========================
         首页
         ========================= -->

    <div id="lobby">

        <div class="panel">

            <h2>进入游戏</h2>


            <input
                id="nameInput"
                type="text"
                maxlength="16"
                placeholder="输入你的昵称"
            >


            <!-- =========================
                 创建房间
                 ========================= -->

            <h3>选择游戏模式</h3>


            <div class="room-buttons">

                <button
                    onclick="createRoom('UNDERCOVER')"
                >
                    🎭 创建10人内鬼房间
                </button>


                <button
                    onclick="createRoom('TEAM')"
                >
                    ⚔️ 创建8人分组房间
                </button>

            </div>


            <button
                class="secondary"
                onclick="showJoinRoom()"
            >
                加入已有房间
            </button>

        </div>


        <!-- =========================
             加入房间
             ========================= -->

        <div
            id="joinPanel"
            class="panel"
            style="display:none;"
        >

            <h2>加入房间</h2>


            <input
                id="roomCodeInput"
                type="text"
                maxlength="6"
                placeholder="输入6位房间号"
            >


            <button onclick="joinRoom()">
                加入
            </button>

        </div>

    </div>


    <!-- =========================
         游戏大厅
         ========================= -->

    <div
        id="room"
        style="display:none;"
    >

        <div class="panel">

            <div class="room-header">

                <div>

                    <h2>🎮 游戏大厅</h2>


                    <p>
                        房间号：
                        <strong id="roomCode">
                            ------
                        </strong>
                    </p>


                    <p>
                        游戏模式：
                        <strong id="roomMode">
                            ------
                        </strong>
                    </p>

                </div>


                <div class="player-count">

                    <span id="playerCount">
                        0
                    </span>

                    /

                    <span id="maxPlayerCount">
                        10
                    </span>

                </div>

            </div>


            <div id="playerList"></div>


            <button
                id="startButton"
                onclick="startGame()"
                style="display:none;"
            >
                🚀 开始游戏
            </button>

        </div>

    </div>


    <!-- =========================
         游戏页面
         ========================= -->

    <div
        id="game"
        style="display:none;"
    >

        <div class="panel">

            <h2>
                第
                <span id="roundNumber">
                    1
                </span>
                局
            </h2>


            <p id="gameNotice">
                点击自己的名字查看身份和任务
            </p>


            <div id="players"></div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
